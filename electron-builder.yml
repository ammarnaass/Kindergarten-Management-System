appId: com.rawdati.app
productName: روضتي
directories:
  output: dist
files:
  - out/**
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
extraResources:
  - from: 'drizzle'
    to: 'drizzle'
  - from: 'resources/fonts'
    to: 'fonts'
win:
  target:
    - nsis
mac:
  target:
    - dmg
  hardenedRuntime: true
linux:
  target:
    - AppImage
    - deb
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
publish:
  provider: generic
  url: https://updates.example.com/rawdati
